<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BranchLine · Coffee preview</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#171719;color:var(--bc-text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}main{max-width:800px;margin:100px auto;padding:0 32px}h1{font-size:22px;font-weight:500;letter-spacing:-.6px;margin:0 0 8px}.intro{color:#afafaf;margin:0;max-width:540px}.bc-previews{display:flex;gap:32px;margin-top:40px;align-items:flex-start;flex-wrap:wrap}.bc-stage{padding:32px 24px 24px;background:#202022;border-radius:16px}.bc-stage[data-bc-theme=light]{background:#eeeef0}
.bc-stage iframe{display:block;width:var(--bc-pop-w);height:109px;border:0;border-radius:var(--bc-radius);box-shadow:0 8px 28px #0002}.bc-stage[data-bc-theme=light] .bc-caption{color:#5d5d5d}.bc-caption{font-size:11px;color:var(--bc-mute);text-align:center;margin:20px 0 0}.bc-note{margin-top:32px;color:#afafaf;font-size:12px;max-width:570px}.bc-status{min-height:44px;margin-top:16px;color:#ededed;font-size:13px} @media(max-width:600px){main{margin:48px auto;padding:0 24px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<main>
<h1>A little coffee. A little support.</h1>
<p class="intro">A friendly invitation, with a small coffee cup and the same quiet, minimal style.</p>
<div class="bc-previews"></div>
<p class="bc-note">Preview at the actual 232px width. The coffee link will open your support page in a new tab.</p>
<p class="bc-status" role="status"></p>
</main>
<script>
for(const theme of ['dark','light']){
 const stage=document.createElement('section');stage.className='bc-stage';stage.dataset.bcTheme=theme;
 const frame=document.createElement('iframe');frame.src=`donation-popup-preview.html?theme=${theme}`;frame.title=`BranchLine popup · ${theme}`;
 const caption=document.createElement('p');caption.className='bc-caption';caption.textContent=theme==='dark'?'Dark · actual size':'Light · actual size';
 stage.append(frame,caption);document.querySelector('.bc-previews').append(stage);
}
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.data?.type!=='bc-coffee-preview')return;
 if(![...document.querySelectorAll('iframe')].some(frame=>frame.contentWindow===event.source))return;
 document.querySelector('.bc-status').textContent='Your coffee page will open here. Payments are not connected in this preview.';
});
</script>
</html>
